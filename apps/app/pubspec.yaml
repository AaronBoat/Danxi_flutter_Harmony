name: dan_xi
description: Maybe the best all-rounded service app for Fudan University students.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.4.4+341

environment:
  sdk: '>=2.18.6 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 基础 UI 组件
  cupertino_icons: ^1.0.6

  # Local modules - 业务模块
  home_module:
    path: ../../modules/home_module
  dashboard_module:
    path: ../../modules/dashboard_module
  forum_module:
    path: ../../modules/forum_module
  course_module:
    path: ../../modules/course_module
  timetable_module:
    path: ../../modules/timetable_module
  
  # Common modules - 公共模块
  network:
    path: ../../common/network
  tools:
    path: ../../common/tools
  widgets:
    path: ../../common/widgets

  # 平台特定依赖（无法下沉到模块的）
  flutter_phoenix: ^1.0.0    # 应用重启
  app_links: ^6.1.3          # 深度链接
  desktop_window: ^0.4.0     # 桌面窗口管理
  
  # 全局状态管理
  provider: ^6.0.5
  
  # 推送服务（平台特定）
  xiao_mi_push_plugin:
    git:
      url: https://github.com/w568w/FlutterXiaoMiPushPlugin.git
      ref: master

dependency_overrides:
  intl: ^0.19.0
  fluttertoast:
    git:
      url: https://github.com/ponnamkarthik/FlutterToast.git
      ref: master
  linkify:
    git:
      url: https://github.com/singularity-s0/linkify.git
      ref: master
  flutter_markdown:
    git:
      url: https://github.com/singularity-s0/flutter_markdown_selectable.git

dev_dependencies:
  build_runner: ^2.1.2
  pubspec_generator: ^4.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  intl_utils: ^2.8.5
  # below used in build.dart
  archive: ^3.4.10
  git: ^2.2.1
  path: ^1.9.0
  args: ^2.4.2

flutter_intl:
  enabled: true

flutter:
  uses-material-design: true
  assets:
    - assets/graphics/
    - assets/graphics/stickers/
    - assets/texts/
  fonts:
    - family: iconfont
      fonts:
        - asset: assets/fonts/iconfont.ttf
