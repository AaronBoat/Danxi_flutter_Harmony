name: network
description: Network layer for DanXi app providing HTTP clients and repositories
version: 1.0.0

environment:
  sdk: '>=2.18.6 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Network dependencies
  dio: ^5.4.3+1
  dio_cookie_manager: ^3.0.0
  http: ^1.0.0
  shared_preferences: ^2.0.15
  
  # Tools dependency
  tools:
    path: ../tools

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
