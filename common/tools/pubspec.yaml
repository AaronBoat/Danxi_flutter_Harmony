name: tools
description: Common tools and utilities for DanXi app
version: 1.0.0

environment:
  sdk: '>=2.18.6 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Core utilities
  path_provider: ^2.0.9
  shared_preferences: ^2.0.15
  url_launcher: ^6.1.12
  clipboard: ^0.1.3
  image_picker: ^1.0.0
  
  # Crypto and encoding
  asn1lib: ^1.1.0
  otp: ^3.0.2
  uuid: ^4.3.3
  
  # Date and time
  lunar: ^1.2.20
  
  # Platform specific
  platform_device_id: ^1.0.1
  device_info_plus: ^10.0.0
  
  # Security
  flutter_secure_storage: ^8.0.0
  
  # Collections and utilities
  collection: '>=1.15.0 <2.0.0'
  meta: '>=1.3.0 <2.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
