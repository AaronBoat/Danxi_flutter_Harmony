name: widgets
description: Common widgets and UI components for DanXi app
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=2.18.6 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI components
  cupertino_icons: ^1.0.5
  auto_size_text: ^3.0.0
  super_sliver_list: ^0.4.0
  cached_network_image: ^3.2.1
  photo_view: ^0.15.0
  flutter_typeahead: ^5.2.0
  flutter_layout_grid: ^2.0.1
  flex_color_picker: ^3.2.0
  material_color_generator: ^1.1.0
  flutter_swiper_view: ^1.1.8
  lazy_load_indexed_stack: ^1.0.0
  
  # Progress and dialogs
  # 暂时移除Git依赖，避免版本冲突
  # flutter_progress_dialog:
  #   git:
  #     url: https://github.com/w568w/flutter_progress_dialog.git
  #     ref: master

  
  
  # Text and markdown
  flutter_linkify: ^6.0.0
  linkify: ^4.0.0                   # 更新到最新版本以兼容HarmonyOS
  flutter_markdown:
    git:
      url: https://github.com/singularity-s0/flutter_markdown_selectable.git       # 使用标准版本，暂时避免Git依赖问题
  markdown: ^6.0.0             # 更新到兼容版本
  flutter_math_fork: ^0.7.2
  
  # QR and sharing
  qr_flutter: ^4.0.0
  share_plus: ^9.0.0
  
  # Local dependencies
  tools:
    path: ../tools

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
