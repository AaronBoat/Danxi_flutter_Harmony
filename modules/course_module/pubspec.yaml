name: course_module
description: Course module for DanXi app providing course management features
version: 1.0.0
publish_to: none # 将此模块标记为不可发布

environment:
  sdk: '>=2.18.6 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  
  # 表格组件
  data_table_2: ^2.5.9
  
  # 搜索功能
  flutter_typeahead: ^5.2.0
  
  # 评分组件
  flutter_rating_bar: ^4.0.1
  
  # 日历组件
  table_calendar: ^3.0.9
  
  # 数据持久化 (降级到兼容Dart 3.4的版本)
  sqflite: ^2.2.8
  
  # Local dependencies
  network:
    path: ../../common/network
  tools:
    path: ../../common/tools
  widgets:
    path: ../../common/widgets

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
