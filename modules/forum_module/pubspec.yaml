name: forum_module
description: Forum module for DanXi app providing community features
version: 1.0.0

environment:
  sdk: '>=2.18.6 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  
  # 图片处理
  image_picker: ^1.0.0
  
  # 富文本编辑
  flutter_markdown:
    git:
      url: https://github.com/singularity-s0/flutter_markdown_selectable.git
  
  # 照片查看器
  photo_view: ^0.15.0
  
  # 文件选择器
  file_picker: ^8.0.0+1
  
  # 无限滚动
  infinite_scroll_pagination: ^4.0.0
  
  # Local dependencies
  network:
    path: ../../common/network
  tools:
    path: ../../common/tools
  widgets:
    path: ../../common/widgets

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
