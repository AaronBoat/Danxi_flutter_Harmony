name: forum_module
description: Forum module for DanXi app providing community features
version: 1.0.0
publish_to: none # 将此模块标记为不可发布

environment:
  sdk: '>=2.18.6 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  
  # 1. 声明对原版库的依赖
  image_picker: ^1.0.0
  file_picker: ^8.0.0+1
  photo_view: ^0.15.0
  infinite_scroll_pagination: ^4.0.0
  
  # Local dependencies
  network:
    path: ../../common/network
  tools:
    path: ../../common/tools
  widgets:
    path: ../../common/widgets

# 2. 在这里强制覆盖为鸿蒙适配版
dependency_overrides:
  image_picker:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      path: packages/image_picker/image_picker_ohos
  file_picker:
    git:
      url: https://gitee.com/openharmony-sig/fluttertpc_file_picker.git

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
