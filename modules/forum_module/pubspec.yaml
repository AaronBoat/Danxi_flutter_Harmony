name: forum_module
description: Forum module for DanXi app providing community features
version: 1.0.0
publish_to: none # 将此模块标记为不可发布

environment:
  sdk: '>=2.18.6 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  
  # 图片处理 (已适配, 仓库名: image_picker)
  image_picker:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      path: packages/image_picker
  
  # 富文本编辑 (官方未适配, 暂时使用社区方案)
#  flutter_markdown:
#    git:
#      url: https://github.com/singularity-s0/flutter_markdown_selectable.git
  
  # 照片查看器 (纯 Dart, 无需适配)
  photo_view: ^0.15.0
  
  # 文件选择器 (已适配, 仓库名: fluttertpc_file_picker)
  file_picker:
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages.git
      path: packages/fluttertpc_file_picker
  
  # 无限滚动 (纯 Dart, 无需适配)
  infinite_scroll_pagination: ^4.0.0
  
  # Local dependencies
  network:
    path: ../../common/network
  tools:
    path: ../../common/tools
  widgets:
    path: ../../common/widgets

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
