name: home_module
description: Home module for DanXi app providing main navigation and home features
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=2.18.6 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  
  # 遵循“无别名，直接使用”原则，只声明原版库依赖
  url_launcher: ^6.1.11 
  shared_preferences: ^2.0.15
  fluttertoast: ^8.2.6
  
  # 其他所有第三方库
  flutter_bloc: ^8.1.3
  dio: ^5.4.3+1
  cupertino_icons: ^1.0.5
  go_router: ^14.0.0
#  flutter_platform_widgets: ^3.4.0 #这个是ios用的
  lazy_load_indexed_stack: ^1.0.0
  provider: ^6.0.5
  quick_actions: ^1.1.0
  receive_intent:
    git:
      url: https://github.com/w568w/receive_intent.git
  screen_capture_event: ^1.0.0
  app_links: ^3.4.1
#  dio5_log: ^1.0.0-beta.3

  # === Local dependencies ===
  network:
    path: ../../common/network
  dan_xi:
    path: ../../apps/app

  # 如果 tools 和 widgets 仍然是独立的公共包，保留它们
  tools:
    path: ../../common/tools
  widgets:
    path: ../../common/widgets
  
  # === Module dependencies ===
  forum_module:
    path: ../forum_module
  timetable_module:
    path: ../timetable_module

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

