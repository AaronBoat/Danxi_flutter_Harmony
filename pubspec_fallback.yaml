name: app_ohos
description: "DanXi HarmonyOS application - modular architecture version"
publish_to: 'none'

version: 1.4.4+341

environment:
  sdk: '>=2.18.6 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_phoenix: ^1.0.0
  provider: ^6.0.5

  # Local modules
  home_module:
    path: ../../modules/home_module
  dashboard_module:
    path: ../../modules/dashboard_module
  forum_module:
    path: ../../modules/forum_module
  course_module:
    path: ../../modules/course_module
  timetable_module:
    path: ../../modules/timetable_module
  
  network:
    path: ../../common/network
  tools:
    path: ../../common/tools
  widgets:
    path: ../../common/widgets

# 使用原版库作为fallback
dependency_overrides:
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
